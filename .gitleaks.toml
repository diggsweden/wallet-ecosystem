title = "Wallet Ecosystem Gitleaks configuration"

# The digg-internal-hosts rule now lives in devbase-check
# (linters/config/org-rules.toml) and is layered on by lint-secrets when
# DEVBASE_CHECK_ORG_RULES=1 (set in this repo's lint-secrets recipe).

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key", "private-key", "jwt"]
description = "We accept 'secrets' in our local docker configuration and our tests"
paths = [
    '^config/',
    '^docker-compose.yaml$',
    '^access-mechanism-poc/docker-compose.yaml$',
    '^src/test/java/',

    # This path was used in the first commits, but is no longer used.
    # We still need to allow this path to avoid linting errors.
    '^eudi-srv-pid-issuer/docker-compose/',
]
