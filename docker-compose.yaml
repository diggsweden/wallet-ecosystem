name: wallet-ecosystem-local

networks:
  wallet-ecosystem-network:
    name: wallet-ecosystem-network
  # Lets containers reach the public 10.0.2.2 URLs (the emulator's host alias)
  # by giving Traefik that address. Used by the Python PID issuer.
  py-issuer-hairpin:
    name: py-issuer-hairpin
    ipam:
      config:
        - subnet: 10.0.2.0/24
volumes:
  softhsm-tokens:
    name: softhsm-tokens
    driver: local

x-kafka-common: &kafka-common
  image: apache/kafka-native:latest@sha256:777f2dddec6970003f1f27922a8c317d87140567b0537e801d35669ad9a81faf
  environment: &kafka-env
    KAFKA_CLUSTER_ID: NjM0OUVDRTItMTg2Ni00QU
    KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    KAFKA_MIN_INSYNC_REPLICAS: 1
    KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  refimpl-verifier-backend:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:v0.12.0@sha256:b56390f2078f9ce705f2b20db86fdd52297c0a587dd4110c82f173c223a3a07f
    container_name: refimpl-verifier-backend
    hostname: refimpl-verifier-backend
    env_file:
      - ./config/certificates/verifier-registration-certificate/registration_certificate.env
    volumes:
      - ./config/certificates/verifier-access-certificate/verifier-access-certificate.p12:/opt/common/verifier-access-certificate.p12:ro
    environment:
      SPRING_WEBFLUX_BASEPATH: "/refimpl-verifier-backend"
      VERIFIER_PUBLICURL: "${BASE_URL}/refimpl-verifier-backend"
      VERIFIER_ORIGINALCLIENTID: "${VERIFIER_CLIENT_ID:-localhost}"
      VERIFIER_CLIENTIDPREFIX: "x509_san_dns"
      SPRING_PROFILES_ACTIVE: "self-signed"
      VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM: "ES256"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE: "file:///opt/common/verifier-access-certificate.p12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_TYPE: "PKCS12"
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD: "${VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD:?Set VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD in .env}"
      VERIFIER_ACCESS_CERTIFICATE_ALIAS: "verifier_access_certificate"
      VERIFIER_ACCESS_CERTIFICATE_PASSWORD: "${VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD:?Set VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD in .env}"
      VERIFIER_DEFAULTHTTPRESPONSEMODE: "DirectPost"
      VERIFIER_ATTESTATIONCLASSIFICATIONS_PID_VCTS: "urn:eudi:pid:1"
      VERIFIER_TRUST_VALIDATOR_SERVICE_URL: "http://trust-validator:8080/trust-validator/trust"
      VERIFIER_INTENDEDUSES_0_ID: "1"
      VERIFIER_INTENDEDUSES_0_DESCRIPTION: "Local registration certificate"
      # VERIFIER_INTENDEDUSES_0_REGISTRATIONCERTIFICATE is loaded from the env_file
      # generated by just pki-generate.
      LOGGING_LEVEL_EU_EUROPA_EC_EUDI_VERIFIER_ENDPOINT: "DEBUG"
      JAVA_OPTS: "-XX:MaxDirectMemorySize=128M"
    depends_on:
      - trust-validator
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.refimpl-verifier-backend.rule=PathPrefix(`/refimpl-verifier-backend`)"
      - "traefik.http.routers.refimpl-verifier-backend.entrypoints=websecure"
      - "traefik.http.routers.refimpl-verifier-backend.tls=true"
      - "traefik.http.routers.refimpl-verifier-backend.service=refimpl-verifier-backend"
      - "traefik.http.services.refimpl-verifier-backend.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  trust-validator:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-trust-validator:0.3.1-alpha@sha256:99f8128fea47a4b9947cf3fca898832c5ff0acdb9b93d25ffd073a549e11c3dd
    container_name: trust-validator
    hostname: trust-validator
    environment:
      SPRING_WEBFLUX_BASE_PATH: "/trust-validator"
      TRUST_VALIDATOR_ENABLE_CERTIFICATE_REVOCATION_CHECK: "false"
      TRUST_VALIDATOR_DSS_FILE_CACHE_LOCATION: "/tmp/dss-cache"
      TRUST_VALIDATOR_LOTE_FILE_CACHE_LOCATION: "/tmp/lote-cache"
      TRUST_VALIDATOR_TRUST_SOURCES_PID_PROVIDERS_LOTE_LOCATION: "http://trust-source/signed/trusted-entities.json"
      TRUST_VALIDATOR_TRUST_SOURCES_PID_PROVIDERS_LOTE_ISSUANCE_SERVICE: "http://uri.etsi.org/19602/SvcType/PID/Issuance"
      TRUST_VALIDATOR_TRUST_SOURCES_PID_PROVIDERS_LOTE_REVOCATION_SERVICE: "http://uri.etsi.org/19602/SvcType/PID/Revocation"

      # Also enable Wallet Providers for E2E tests
      TRUST_VALIDATOR_TRUST_SOURCES_WALLET_PROVIDERS_LOTE_LOCATION: "http://trust-source/signed/trusted-entities.json"
      TRUST_VALIDATOR_TRUST_SOURCES_WALLET_PROVIDERS_LOTE_ISSUANCE_SERVICE: "http://uri.etsi.org/19602/SvcType/WalletSolution/Issuance"
      TRUST_VALIDATOR_TRUST_SOURCES_WALLET_PROVIDERS_LOTE_REVOCATION_SERVICE: "http://uri.etsi.org/19602/SvcType/WalletSolution/Revocation"
    depends_on:
      - trust-source
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trust-validator.rule=PathPrefix(`/trust-validator`)"
      - "traefik.http.routers.trust-validator.entrypoints=websecure"
      - "traefik.http.routers.trust-validator.tls=true"
      - "traefik.http.routers.trust-validator.service=trust-validator"
      - "traefik.http.services.trust-validator.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  trust-source:
    image: nginx:1.31.6-alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7
    container_name: trust-source
    hostname: trust-source
    volumes:
      - ./config/trust-source/:/usr/share/nginx/html/:ro
      - ./config/nginx/trust-source.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trust-source.rule=PathPrefix(`/trust-source`)"
      - "traefik.http.routers.trust-source.entrypoints=websecure"
      - "traefik.http.routers.trust-source.tls=true"
      - "traefik.http.routers.trust-source.service=trust-source"
      - "traefik.http.routers.trust-source.middlewares=trust-source-rewrite"
      - "traefik.http.services.trust-source.loadbalancer.server.port=80"
      - "traefik.http.middlewares.trust-source-rewrite.replacepathregex.regex=^/trust-source/(.*)"
      - "traefik.http.middlewares.trust-source-rewrite.replacepathregex.replacement=/$1"
    networks:
      - wallet-ecosystem-network

  wallet-attestation-issuer:
    image: ghcr.io/diggsweden/wallet-attestation-issuer:v0.2.1@sha256:dc3483b328c1f6ea51398b31d8327576163f3de0bbdfc9a8b8f795e68fa346f4
    container_name: wallet-attestation-issuer
    hostname: wallet-attestation-issuer
    volumes:
      - ./config/certificates/wallet-attestation-issuer/wallet_attestation_issuer.p12:/opt/common/wallet_attestation_issuer.p12
    environment:
      SERVER_SERVLET_CONTEXT_PATH: "/wallet-attestation-issuer"
      SPRING_PROFILES_ACTIVE: "prod"
      TZ: "Europe/Stockholm"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      WUA_KEYSTORE_PATH: "file:///opt/common/wallet_attestation_issuer.p12"
      WUA_KEYSTORE_PASSWORD: "${WALLET_ATTESTATION_ISSUER_KEYSTORE_PASSWORD:?Set WALLET_ATTESTATION_ISSUER_KEYSTORE_PASSWORD in .env}"
      WUA_KEYSTORE_ALIAS: "wallet_attestation_issuer"
      WALLET_ATTESTATION_ISSUER_ISSUER: "Digg"
      WALLET_ATTESTATION_ISSUER_WUA_STATUS: '{"status_list": {"idx": 412,"uri": "http://trust-source/signed/status-list.jwt"}}'
      WALLET_ATTESTATION_ISSUER_WIA_CLIENT_ID: "wallet-dev"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_NAME: "Digg Wallet"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_VERSION: "0.0.1"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_LINK: "${BASE_URL}/wallet-attestation-issuer"
      WALLET_ATTESTATION_ISSUER_WIA_CERTIFICATION_INFORMATION: "UNCERTIFIED"
      WALLET_ATTESTATION_ISSUER_WIA_VALIDITY_MINUTES: "60"
      WALLET_ATTESTATION_ISSUER_WIA_STATUS: '{"status_list": {"idx": 412,"uri": "http://trust-source/signed/status-list.jwt"}}'
      WALLET_ATTESTATION_ISSUER_WIA_STATUS_MAINTENANCE_DAYS: "365"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet-attestation-issuer.rule=PathPrefix(`/wallet-attestation-issuer`)"
      - "traefik.http.routers.wallet-attestation-issuer.entrypoints=websecure"
      - "traefik.http.routers.wallet-attestation-issuer.tls=true"
      - "traefik.http.routers.wallet-attestation-issuer.service=wallet-attestation-issuer"
      - "traefik.http.services.wallet-attestation-issuer.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  wallet-provider:
    image: ghcr.io/diggsweden/wallet-attestation-issuer:v0.2.1@sha256:dc3483b328c1f6ea51398b31d8327576163f3de0bbdfc9a8b8f795e68fa346f4
    container_name: wallet-provider
    hostname: wallet-provider
    volumes:
      - ./config/certificates/wallet-provider/wallet_provider.p12:/opt/common/wallet_provider.p12
    environment:
      SERVER_SERVLET_CONTEXT_PATH: "/wallet-provider"
      SPRING_PROFILES_ACTIVE: "prod"
      TZ: "Europe/Stockholm"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      WUA_KEYSTORE_PATH: "file:///opt/common/wallet_provider.p12"
      WUA_KEYSTORE_PASSWORD: "${WALLET_PROVIDER_KEYSTORE_PASSWORD:?Set WALLET_PROVIDER_KEYSTORE_PASSWORD in .env}"
      WUA_KEYSTORE_ALIAS: "wallet_provider"
      WALLET_ATTESTATION_ISSUER_ISSUER: "Digg"
      WALLET_ATTESTATION_ISSUER_WUA_STATUS: '{"status_list": {"idx": 412,"uri": "http://trust-source/signed/status-list.jwt"}}'
      WALLET_ATTESTATION_ISSUER_WIA_CLIENT_ID: "wallet-dev"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_NAME: "Digg Wallet"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_VERSION: "0.0.1"
      WALLET_ATTESTATION_ISSUER_WIA_WALLET_LINK: "${BASE_URL}/wallet-provider"
      WALLET_ATTESTATION_ISSUER_WIA_CERTIFICATION_INFORMATION: "UNCERTIFIED"
      WALLET_ATTESTATION_ISSUER_WIA_VALIDITY_MINUTES: "60"
      WALLET_ATTESTATION_ISSUER_WIA_STATUS: '{"status_list": {"idx": 412,"uri": "http://trust-source/signed/status-list.jwt"}}'
      WALLET_ATTESTATION_ISSUER_WIA_STATUS_MAINTENANCE_DAYS: "365"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet-provider.rule=PathPrefix(`/wallet-provider`)"
      - "traefik.http.routers.wallet-provider.entrypoints=websecure"
      - "traefik.http.routers.wallet-provider.tls=true"
      - "traefik.http.routers.wallet-provider.service=wallet-provider"
      - "traefik.http.services.wallet-provider.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  demo-verifier:
    image: ghcr.io/diggsweden/wallet-verifier-test-web:0.1.18@sha256:8a4a262be3c6e44e7c86ba44fe1732a4dd60b0ee06afaabba400f216fdc36cea
    container_name: demo-verifier
    hostname: demo-verifier
    environment:
      HOST_API: "http://refimpl-verifier-backend:8080/refimpl-verifier-backend"
      PORT: "3002"
      NITRO_PORT: "3002"
      NUXT_PUBLIC_BASE_URL: "${BASE_URL}/demo-verifier"
      NUXT_APP_BASE_URL: "/demo-verifier"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - refimpl-verifier-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo-verifier.rule=PathPrefix(`/demo-verifier`)"
      - "traefik.http.routers.demo-verifier.entrypoints=websecure"
      - "traefik.http.routers.demo-verifier.tls=true"
      - "traefik.http.services.demo-verifier.loadbalancer.server.port=3002"
    restart: on-failure
    networks:
      - wallet-ecosystem-network

  # Python PID issuer (eudi-srv-web-issuing-eudiw-py + its authorization server
  # and frontend), built from sibling checkouts. Each service is served at the
  # root of its own Traefik entrypoint: frontend :9443, backend :9444, AS :9445.
  # Public URLs use 10.0.2.2 for the Android emulator; containers reach it via
  # Traefik's static IP on py-issuer-hairpin.
  py-issuer-backend:
    build:
      context: ../eudi-srv-web-issuing-eudiw-py
      dockerfile: ../wallet-ecosystem/config/py-issuer/backend.Dockerfile
    image: localhost/py-issuer-backend:dev
    container_name: py-issuer-backend
    hostname: py-issuer-backend
    depends_on:
      pid-issuer-db:
        condition: service_healthy
    environment:
      ISSUER_CONFIG_PATH: /etc/issuer_config/config_issuer_backend.yaml
      REQUESTS_CA_BUNDLE: /etc/eudiw/keys/tls-ca.pem
      FLASK_DEBUG: "1"
    volumes:
      - ./config/py-issuer/backend.yaml:/etc/issuer_config/config_issuer_backend.yaml:ro
      - ./config/py-issuer/keys:/etc/eudiw/keys:ro
      - ./config/pid-issuer/issuer_wrprc.jwt:/etc/eudiw/registration/issuer_wrprc.jwt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wallet-ecosystem-network"
      - "traefik.http.routers.py-issuer-backend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.py-issuer-backend.entrypoints=py-backend"
      - "traefik.http.routers.py-issuer-backend.tls=true"
      - "traefik.http.services.py-issuer-backend.loadbalancer.server.port=5000"
    networks:
      - wallet-ecosystem-network
      - py-issuer-hairpin

  py-issuer-oidc:
    build:
      context: ../eudi-srv-issuer-oidc-py
      dockerfile: ../wallet-ecosystem/config/py-issuer/oidc.Dockerfile
    image: localhost/py-issuer-oidc:dev
    container_name: py-issuer-oidc
    hostname: py-issuer-oidc
    environment:
      REQUESTS_CA_BUNDLE: /etc/eudiw/keys/tls-ca.pem
    volumes:
      - ./config/py-issuer/oidc.json:/etc/issuer_config/authorization_config.json:ro
      - ./config/py-issuer/keys/tls-ca.pem:/etc/eudiw/keys/tls-ca.pem:ro
      # WIA signing certificates (leaf, not CA) the auth server trusts, like the hosted issuer.
      - ./config/py-issuer/keys/trusted-attesters:/etc/eudiw/trusted-attesters:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wallet-ecosystem-network"
      - "traefik.http.routers.py-issuer-oidc.rule=PathPrefix(`/`)"
      - "traefik.http.routers.py-issuer-oidc.entrypoints=py-oidc"
      - "traefik.http.routers.py-issuer-oidc.tls=true"
      - "traefik.http.services.py-issuer-oidc.loadbalancer.server.port=5000"
    networks:
      - wallet-ecosystem-network
      - py-issuer-hairpin

  py-issuer-frontend:
    build:
      context: ../eudi-srv-web-issuing-frontend-eudiw-py
      dockerfile: ../wallet-ecosystem/config/py-issuer/frontend.Dockerfile
    image: localhost/py-issuer-frontend:dev
    container_name: py-issuer-frontend
    hostname: py-issuer-frontend
    depends_on:
      - py-issuer-backend
      - traefik
    environment:
      ISSUER_CONFIG_PATH: /etc/issuer_config/frontend_config.yaml
      REQUESTS_CA_BUNDLE: /etc/eudiw/keys/tls-ca.pem
      FLASK_DEBUG: "1"
    volumes:
      - ./config/py-issuer/frontend.yaml:/etc/issuer_config/frontend_config.yaml:ro
      - ./config/py-issuer/keys/tls-ca.pem:/etc/eudiw/keys/tls-ca.pem:ro
    # Fetches backend metadata at startup; retry until the backend is up.
    restart: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wallet-ecosystem-network"
      - "traefik.http.routers.py-issuer-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.py-issuer-frontend.entrypoints=py-frontend"
      - "traefik.http.routers.py-issuer-frontend.tls=true"
      - "traefik.http.services.py-issuer-frontend.loadbalancer.server.port=5000"
      # The app opens ${BASE_URL}/pid-issuer; send it to the Python frontend.
      - "traefik.http.routers.pid-issuer-redirect.rule=PathPrefix(`/pid-issuer`)"
      - "traefik.http.routers.pid-issuer-redirect.entrypoints=websecure"
      - "traefik.http.routers.pid-issuer-redirect.tls=true"
      - "traefik.http.routers.pid-issuer-redirect.middlewares=pid-issuer-redirect"
      - "traefik.http.middlewares.pid-issuer-redirect.redirectregex.regex=^https://([^/:]+)(:443)?/pid-issuer.*"
      - "traefik.http.middlewares.pid-issuer-redirect.redirectregex.replacement=https://$${1}:9443/"
    networks:
      - wallet-ecosystem-network
      - py-issuer-hairpin

  pid-issuer-db:
    image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
    container_name: pid-issuer-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pid-issuer
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: pid-issuer
    volumes:
      - ./config/pid-issuer-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pid-issuer -d pid-issuer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-ecosystem-network

  wallet-account-db:
    image: "postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b"
    container_name: wallet-account-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wallet-account
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: wallet-account
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet-account -d wallet-account"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-ecosystem-network

  wallet-account:
    image: ghcr.io/diggsweden/wallet-account:v0.1.10@sha256:bce1f5713e2fa48e215cc9ca7d3d672485e0bd676ac0677d85d22b92d671da53
    container_name: wallet-account
    hostname: wallet-account
    volumes:
      - ./config/common/Healthcheck.class:/opt/Healthcheck.class:ro
    environment:
      SERVER_SERVLET_CONTEXT_PATH: "/wallet-account"
      SPRING_PROFILES_ACTIVE: "prod"
      TZ: "Europe/Stockholm"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://wallet-account-db:5432/wallet-account"
      SPRING_DATASOURCE_USERNAME: "wallet-account"
      SPRING_DATASOURCE_PASSWORD: "pass"
    ports:
      - "8083:8080"
    depends_on:
      wallet-account-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "--class-path", "/opt", "Healthcheck", "http://localhost:8080/wallet-account/actuator/health"]
      start_period: 5s
      interval: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet-account.rule=PathPrefix(`/wallet-account`)"
      - "traefik.http.routers.wallet-account.entrypoints=websecure"
      - "traefik.http.routers.wallet-account.tls=true"
      - "traefik.http.routers.wallet-account.service=wallet-account"
      - "traefik.http.services.wallet-account.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  wallet-client-gateway-valkey:
    image: "valkey/valkey:9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b"
    container_name: wallet-client-gateway-valkey
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6378:6379"
    networks:
      - wallet-ecosystem-network

  wallet-client-gateway:
    image: ghcr.io/diggsweden/wallet-client-gateway:v0.6.16@sha256:fdf068ea96043581c366e3e52b844ee42be4b08371e1b17139c0f13a71edf788
    container_name: wallet-client-gateway
    hostname: wallet-client-gateway
    volumes:
      - ./config/common/Healthcheck.class:/opt/Healthcheck.class:ro
      - ./config/wallet-client-gateway:/etc/wallet-client-gateway:ro
    environment:
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      SERVER_SERVLET_CONTEXT_PATH: "/wallet-client-gateway"
      SPRING_PROFILES_ACTIVE: "prod"
      TZ: "Europe/Stockholm"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      SERVER_PORT: "8080"
      PROPERTIES_APISECRET: "apikey"
      PROPERTIES_WALLETPROVIDER_BASEURL: "http://wallet-provider:8080/wallet-provider"
      PROPERTIES_WALLETACCOUNT_BASEURL: "http://wallet-account:8080/wallet-account"
      PROPERTIES_WALLETR2PS_BASEURL: "http://wallet-bff:8088"
      PROPERTIES_FEATUREFLAGS_FILEPATH: "/etc/wallet-client-gateway/feature-flags.json"
      PROPERTIES_CLIENTCONFIG_FEATURES: "example"
      SPRING_DATA_REDIS_HOST: "wallet-client-gateway-valkey"
      SPRING_DATA_REDIS_PORT: "6379"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
    ports:
      - "8082:8080"
    depends_on:
      wallet-bff:
        condition: service_started
      wallet-provider:
        condition: service_started
      wallet-account:
        condition: service_started
      wallet-client-gateway-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "--class-path", "/opt", "Healthcheck", "http://localhost:8080/wallet-client-gateway/actuator/health"]
      start_period: 5s
      interval: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet-client-gateway.rule=PathPrefix(`/wallet-client-gateway`)"
      - "traefik.http.routers.wallet-client-gateway.entrypoints=websecure"
      - "traefik.http.routers.wallet-client-gateway.tls=true"
      - "traefik.http.routers.wallet-client-gateway.service=wallet-client-gateway"
      - "traefik.http.services.wallet-client-gateway.loadbalancer.server.port=8080"
    networks:
      - wallet-ecosystem-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    container_name: keycloak
    command:
      - start
      - --import-realm
      - --features=dpop
    environment:
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/idp
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${BASE_URL}/idp
      - KC_HOSTNAME_ADMIN=${BASE_URL}/idp-internal
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_DB=dev-file
      - KEYCLOAK_PID_ISSUER_CLIENT_SECRET=cow3go8W5gbI5HcR5mim7O00DAYaAmfv
    healthcheck:
      # This is the recommended way to perform the healthcheck without curl, as per:
      # https://www.keycloak.org/observability/health#_healthcheck
      test: ["CMD-SHELL", "{ printf 'HEAD /idp/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 120s
    volumes:
      - ./config/keycloak/themes/:/opt/keycloak/themes
      - ./config/keycloak/realms/:/opt/keycloak/data/import/
    labels:
      - "traefik.enable=true"
      # Whitelist: pid-issuer-realm and shared resources
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/idp/realms/pid-issuer-realm`) || PathPrefix(`/idp/resources`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.service=keycloak"
      # Whitelist: health endpoints → management port 9000
      - "traefik.http.routers.keycloak-health.rule=PathPrefix(`/idp/health`)"
      - "traefik.http.routers.keycloak-health.entrypoints=websecure"
      - "traefik.http.routers.keycloak-health.tls=true"
      - "traefik.http.routers.keycloak-health.service=keycloak-health"
      # Keycloak services
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.services.keycloak-health.loadbalancer.server.port=9000"
      # OAuth server discovery endpoint
      - "traefik.http.routers.well-known-oauth-server.rule=PathPrefix(`/.well-known/oauth-authorization-server`)"
      - "traefik.http.routers.well-known-oauth-server.entrypoints=websecure"
      - "traefik.http.routers.well-known-oauth-server.tls=true"
      - "traefik.http.routers.well-known-oauth-server.service=keycloak"
      - "traefik.http.routers.well-known-oauth-server.middlewares=well-known-oauth-server-replace-path"
      - "traefik.http.middlewares.well-known-oauth-server-replace-path.replacepathregex.regex=^/.well-known/([a-zA-Z-]+)/idp/realms/([a-zA-Z-]+)/?"
      - "traefik.http.middlewares.well-known-oauth-server-replace-path.replacepathregex.replacement=/idp/realms/$2/.well-known/$1"
      # Internal route: full access to all Keycloak paths including admin and master realm & master realm protocol endpoints (login, OIDC, 3P cookies)
      - "traefik.http.routers.keycloak-internal.rule=PathPrefix(`/idp-internal`)"
      - "traefik.http.routers.keycloak-internal.entrypoints=websecure"
      - "traefik.http.routers.keycloak-internal.tls=true"
      - "traefik.http.routers.keycloak-internal.service=keycloak"
      - "traefik.http.routers.keycloak-internal.middlewares=keycloak-internal-rewrite"
      # middleware
      - "traefik.http.middlewares.keycloak-internal-rewrite.replacepathregex.regex=^/idp-internal(.*)"
      - "traefik.http.middlewares.keycloak-internal-rewrite.replacepathregex.replacement=/idp$$1"

    networks:
      - wallet-ecosystem-network

  wallet-bff:
    image: ghcr.io/diggsweden/wallet-r2ps/wallet-bff:0.0.0-dev-main-46bb7f9@sha256:4c4b7f4d73c9e528e83e692ff8a46448c73b359a8b2d33bcea015fe098ee1fb7
    ports:
      - "8088:8088"
      - "9012:8000"
    restart: on-failure
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      kafka-1:
        condition: service_healthy
      wallet-client-gateway-valkey:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092"
      KAFKA_BROKER_ADDRESS_FAMILY: "v4"
      KAFKA_GROUP_ID: "r2ps-rest-api-group"
      REDIS_HOST: "wallet-client-gateway-valkey"
      REDIS_PORT: 6379
      REDIS_USERNAME: "default"
      REDIS_PASSWORD: "secret"
      REDIS_DATABASE: 0
      SERVER_PORT: 8088
      SERVE_SYNC: "true"
      SYNC_TIMEOUT_MS: 3000
      RESPONSE_TTL_SECONDS: 600
      HSM_WORKER_RESPONSE_TOPIC: "hsm-worker-responses-bff-1"
      STATE_INIT_RESPONSE_TOPIC: "state-init-responses-bff-1"
      RUST_LOG: "wallet_bff=info,rdkafka=warn,redis=warn"
      TZ: "Europe/Stockholm"
    networks:
      - wallet-ecosystem-network

  hsm-worker:
    image: ghcr.io/diggsweden/wallet-r2ps/hsm-worker:0.0.0-dev-main-46bb7f9@sha256:29b2ee806fd1773ce1838abdd1d8abf1a258b3dfc4da34b58603239b8d7c0b3a
    env_file:
      - .env.opaque
      - .env.softhsm
    environment:
      RUST_LOG: info
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092"
    volumes:
      - softhsm-tokens:/myuser/softhsm/tokens:rw
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - wallet-ecosystem-network

  kafka-1:
    !!merge <<: *kafka-common
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      !!merge <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,EXTERNAL://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - wallet-ecosystem-network

  init-kafka:
    image: apache/kafka:latest@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    depends_on:
      kafka-1:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-e", "/tmp/init-kafka-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092"
      WALLET_STATE_TOPIC: "wallet-state"
      REQUEST_TOPICS: "hsm-requests,state-init-requests"
      RESPONSE_TOPICS: "hsm-worker-responses-bff-1,state-init-responses-bff-1,hsm-worker-responses-bff-2,state-init-responses-bff-2"
      REQUEST_TOPIC_PARTITIONS: 10
      WALLET_STATE_REPLICATION_FACTOR: 1
      WALLET_STATE_MIN_INSYNC_REPLICAS: 1
      TRANSIENT_REPLICATION_FACTOR: 1
      TRANSIENT_MIN_INSYNC_REPLICAS: 1
    volumes:
      - ./config/init-kafka-topics.sh:/tmp/init-kafka-topics.sh
    networks:
      - wallet-ecosystem-network

  # Optional: Kafka UI for management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wallet-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092
    networks:
      - wallet-ecosystem-network

  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    container_name: traefik
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "8080:8080"
      - "9443:9443"
      - "9444:9444"
      - "9445:9445"
    volumes:
      - ${PODMAN_SOCK:-$XDG_RUNTIME_DIR/podman/podman.sock}:/var/run/docker.sock:ro
      - ./config/traefik:/etc/traefik
    command:
      - "--ping"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.py-frontend.address=:9443"
      - "--entrypoints.py-backend.address=:9444"
      - "--entrypoints.py-oidc.address=:9445"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      - "--serverstransport.insecureskipverify=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    labels:
      - "traefik.enable=true"
    networks:
      wallet-ecosystem-network:
      py-issuer-hairpin:
        ipv4_address: 10.0.2.2
