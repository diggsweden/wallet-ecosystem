name: Podman Smoke Test

on:
  push:
    branches:
      - test/podman-preinstalled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify preinstalled Podman tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wallet Ecosystem
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Inspect preinstalled container tooling
        run: |
          echo "::group::Runner environment"
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "Kernel: $(uname -srmo)"
          echo "User: $(id)"
          echo "::endgroup::"

          echo "::group::Executable locations"
          echo "podman: $(command -v podman || echo 'NOT FOUND')"
          echo "podman-compose: $(command -v podman-compose || echo 'NOT FOUND')"
          echo "docker: $(command -v docker || echo 'NOT FOUND')"
          echo "::endgroup::"

          echo "::group::Tool versions"
          echo "Checking Podman version..."
          podman --version

          echo "Checking the Compose provider selected by Podman..."
          podman compose version

          echo "Checking the preinstalled Docker Compose version..."
          docker compose version
          echo "::endgroup::"

          echo "::group::Rootless Podman information"
          podman info
          echo "::endgroup::"

          echo "::group::Podman API socket"
          if systemctl --user is-active --quiet podman.socket; then
            echo "Podman socket is active before any workflow configuration."
          else
            echo "Podman socket is inactive before any workflow configuration."
          fi
          echo "::endgroup::"

          echo "Preinstalled Podman and its Compose provider are usable."

      - name: Validate ecosystem Compose configuration
        run: |
          echo "Validating docker-compose.yaml with values from .env.example..."
          podman compose --env-file .env.example config --quiet
          echo "Compose configuration is valid."

          echo "::group::Resolved services"
          podman compose --env-file .env.example config --services
          echo "::endgroup::"

          echo "::group::Resolved images"
          podman compose --env-file .env.example config --images | sort -u
          echo "::endgroup::"
